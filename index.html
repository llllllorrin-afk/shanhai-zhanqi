  { id:'baisu',name:'白素贞',cost:4,lives:2,range:3,targets:1,dmg:1,unlock:4,emoji:'❄️',color:'#85B7EB',role:'冰冻控制',tags:['stun'],desc:'冻结敌人1回合',myth:'白蛇传' },
  { id:'laojun',name:'太上老君',cost:4,lives:2,range:2,targets:1,dmg:1,unlock:4,emoji:'☯️',color:'#7F77DD',role:'团队治疗',heal:1,healScope:'allAlly',desc:'治疗全体友军',myth:'道教' },
  { id:'dapeng',name:'大鹏',cost:5,lives:3,range:2,targets:3,dmg:1,unlock:4,emoji:'🦅',color:'#534AB7',role:'突进',tags:['dash'],desc:'登场飞到最前排',myth:'大鹏金翅鸟' },
  { id:'yinglong',name:'应龙',cost:6,lives:5,range:3,targets:3,dmg:2,unlock:5,emoji:'🐉',color:'#1D9E75',role:'范围核心',desc:'范围3目标各-2命',myth:'应龙助禹' },
  { id:'yudi',name:'玉皇大帝',cost:7,lives:4,range:9,targets:2,dmg:1,unlock:5,emoji:'👑',color:'#FAC775',role:'全场+产金',gold:2,desc:'攻全场2敌+2金',myth:'天庭之主' },
  { id:'nvwa',name:'女娲',cost:6,lives:3,range:3,targets:2,dmg:1,unlock:5,emoji:'🌟',color:'#F4C0D1',role:'复活',tags:['revive'],desc:'每回合复活1友军',myth:'女娲补天' },
  { id:'chiyou',name:'蚩尤',cost:7,lives:5,range:1,targets:3,dmg:1,unlock:5,emoji:'⚔️',color:'#791F1F',role:'战神',tags:['rage'],desc:'命越低目标越多',myth:'逐鹿之战' }
];
const UNIT_MAP={}; UNITS.forEach(u=>UNIT_MAP[u.id]=u);
const BOARD_ROWS=8, BOARD_COLS=4, PLAYER_ROWS=4, START_GOLD=5, GOLD_PER_ROUND=1, START_LIFE=3, MAX_LEVEL=5;
// 经济：利息（每持有 5 金币 +1，上限 5）— 双方同规则
const INTEREST_PER=5, MAX_INTEREST=5;
function calcInterest(gold){ return Math.min(MAX_INTEREST, Math.floor(gold/INTEREST_PER)); }
// 从「已解锁」英雄池随机抽 n 个（保证敌方与玩家强度对等）
function randomRoster(level,n,r){
  const pool=UNITS.filter(u=>u.unlock<=level).map(u=>u.id);
  const arr=pool.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=arr[i];arr[i]=arr[j];arr[j]=t; }
  return arr.slice(0,Math.min(n,arr.length));
}

// ===== 经验 / 账号等级（跨对局累积，存本地）=====
// 累计经验门槛：前期升得快，2 级后逐级拉长
//   Lv1→2 需 12（约 1 局）
//   Lv2→3 需 28（累计 40）
//   Lv3→4 需 50（累计 90）
//   Lv4→5 需 90（累计 180）
const EXP_TABLE=[0,12,40,90,180];
const XP_KEY='shz_xp_v1';
function loadXp(){ try{ const v=localStorage.getItem(XP_KEY); return v?parseInt(v,10)||0:0; }catch(e){ return 0; } }
function saveXp(v){ try{ localStorage.setItem(XP_KEY,String(v)); }catch(e){} }
function levelOfXp(xp){ let lv=1; for(let i=1;i<EXP_TABLE.length;i++){ if(xp>=EXP_TABLE[i]) lv=i+1; } return lv; }
function expProgress(xp){ const lv=levelOfXp(xp);
  if(lv>=MAX_LEVEL) return {lv,cur:0,need:0,pct:100,max:true};
  const cur=xp-EXP_TABLE[lv-1], need=EXP_TABLE[lv]-EXP_TABLE[lv-1];
  return {lv,cur,need,pct:Math.round(cur/need*100)}; }
const XP_PER_ROUND=1, XP_WIN=12, XP_LOSE=0; // 每回合+1，胜利+12，失败不获得经验
let _uid=1; const nextUid=()=>'u'+(_uid++); const rng=Math.random;
const levelOf = r => Math.min(MAX_LEVEL, Math.max(1,r));

function makeUnit(id,side){ const b=UNIT_MAP[id]; return { uid:nextUid(), id:b.id, side, name:b.name, emoji:b.emoji, color:b.color, role:b.role, cost:b.cost,
  lives:b.lives, maxLives:b.lives, range:b.range, targets:b.targets, dmg:b.dmg||1, gold:b.gold||0, heal:b.heal||0, healScope:b.healScope||'',
  tags:b.tags||[], row:-1, col:-1, alive:true, stunned:false, anim:'' }; }

function shopView(rosterIds, level){
  return rosterIds.map(id=>UNIT_MAP[id]).filter(Boolean).sort((a,b)=>a.cost-b.cost)
    .map(u=>({ id:u.id,name:u.name,emoji:u.emoji,color:u.color,cost:u.cost,role:u.role,lives:u.lives,range:u.range,targets:u.targets,desc:u.desc,locked:u.unlock>level,unlock:u.unlock }));
}
function shiftRow(units,row,dirLR){ const inRow=units.filter(u=>u.alive&&u.row===row); if(!inRow.length)return;
  inRow.forEach(u=>{ let nc=(u.col+dirLR)%BOARD_COLS; if(nc<0)nc+=BOARD_COLS; u._nc=nc; }); inRow.forEach(u=>{u.col=u._nc;delete u._nc;}); }
function advance(units){
  const bt=[];
  for(let c=0;c<BOARD_COLS;c++){
    const col=units.filter(u=>u.alive&&u.col===c); if(!col.length)continue;
    col.forEach(u=>{ u._fr=u.row; u._broke=false; });
    const order=col.slice().sort((a,b)=>{ const pa=a.side==='player'?(BOARD_ROWS-1-a.row):a.row; const pb=b.side==='player'?(BOARD_ROWS-1-b.row):b.row; return pa-pb; });
    order.forEach(u=>{ if(u.stunned)return;
      const dir=u.side==='player'?1:-1; const tr=u.row+dir;
      if(tr<0||tr>BOARD_ROWS-1){ u.alive=false;u._broke=true;bt.push({side:u.side});return; }
      const blocked=col.some(o=>o!==u&&!o._broke&&o._fr===tr); if(!blocked) u._fr=tr; });
    col.forEach(u=>{ if(!u._broke) u.row=u._fr; });
  }
  for(let i=units.length-1;i>=0;i--){ if(units[i]._broke){units.splice(i,1);continue;} delete units[i]._fr; }
  return { breakthroughs:bt };
}
function combat(units){
  const dist=(a,b)=>Math.abs(a.row-b.row)+Math.abs(a.col-b.col); const events=[];
  units.forEach(u=>{ u._newStun=false; });
  units.filter(u=>u.alive).slice().forEach(u=>{
    if(!u.alive)return;
    if(u.heal>0&&u.healScope){ let ts=[];
      if(u.healScope==='back1'){ const dir=u.side==='player'?-1:1; const t=units.find(f=>f.alive&&f.side===u.side&&f.col===u.col&&f.row===u.row+dir); if(t)ts=[t]; }
      else if(u.healScope==='lowest'){ let low=1e9,best=null; units.forEach(f=>{ if(f.alive&&f.side===u.side&&f!==u&&f.lives<f.maxLives&&f.lives<low){low=f.lives;best=f;} }); if(best)ts=[best]; }
      else if(u.healScope==='allAlly'){ ts=units.filter(f=>f.alive&&f.side===u.side&&f.lives<f.maxLives); }
      ts.forEach(t=>{ t.lives=Math.min(t.maxLives,t.lives+u.heal); events.push({type:'heal',from:u.uid,to:t.uid,amount:u.heal}); }); }
    let enemies=units.filter(t=>t.alive&&t.side!==u.side&&dist(u,t)<=u.range); if(!enemies.length)return;
    let n=u.targets; if(u.tags.indexOf('rage')>=0) n=u.targets+(u.maxLives-u.lives);
    if(u.tags.indexOf('targetMaxLives')>=0) enemies.sort((a,b)=>b.lives-a.lives||dist(u,a)-dist(u,b)); else enemies.sort((a,b)=>dist(u,a)-dist(u,b));
    enemies.slice(0,n).forEach(t=>{ t.lives-=u.dmg; events.push({type:'dmg',from:u.uid,fromSide:u.side,to:t.uid,amount:u.dmg});
      if(u.tags.indexOf('stun')>=0) t._newStun=true;
      if(t.lives<=0){ t.lives=0;t.alive=false;events.push({type:'die',uid:t.uid}); } });
  });
  units.forEach(u=>{ u.stunned=!!u._newStun; delete u._newStun; });
  const deadPool=units.filter(u=>!u.alive);
  units.filter(u=>u.alive&&u.tags.indexOf('revive')>=0).forEach(nv=>{
    const da=deadPool.find(d=>d.side===nv.side&&!d._revived);
    if(da){ const hr=nv.side==='player'?0:BOARD_ROWS-1; const occ=units.filter(u=>u.alive&&u.row===hr).map(u=>u.col);
      let c=-1; for(let i=0;i<BOARD_COLS;i++) if(occ.indexOf(i)===-1){c=i;break;}
      if(c>=0){ da.alive=true;da.lives=1;da.row=hr;da.col=c;da._revived=true;events.push({type:'revive',uid:da.uid}); } } });
  for(let i=units.length-1;i>=0;i--) if(!units[i].alive) units.splice(i,1);
  return { events };
}
function collectGold(units,side){ let g=0; units.forEach(u=>{ if(u.alive&&u.side===side&&u.gold>0)g+=u.gold; }); return g; }
function onEnter(unit,units){
  if(unit.tags&&unit.tags.indexOf('dash')>=0){ const fr=unit.side==='player'?PLAYER_ROWS-1:BOARD_ROWS-PLAYER_ROWS;
    if(!units.some(o=>o.alive&&o!==unit&&o.row===fr&&o.col===unit.col)) unit.row=fr; }
  if(unit.tags&&unit.tags.indexOf('knockback')>=0){ const dir=unit.side==='player'?1:-1;
    const f=units.find(o=>o.alive&&o.side!==unit.side&&o.col===unit.col&&o.row===unit.row+dir);
    if(f){ const br=f.row+dir; if(br>=0&&br<=BOARD_ROWS-1&&!units.some(o=>o.alive&&o.row===br&&o.col===f.col)) f.row=br; } }
}
// 敌方 AI：经济与玩家完全对称，英雄池来自已解锁，每回合最多买2个，不总选最优
function aiTurn(state,rng){
  const lvl=state.level||1;
  const roster=(state.enemyRoster||[]).map(id=>UNIT_MAP[id]).filter(u=>u&&u.unlock<=lvl).sort((a,b)=>a.cost-b.cost);
  if(!roster.length) return;
  const maxBuy=state.aiMaxBuy||2;
  let g=0;
  while(g++<maxBuy){
    const occ=state.units.filter(u=>u.alive&&u.side==='enemy'&&u.row===BOARD_ROWS-1).map(u=>u.col);
    const free=[]; for(let c=0;c<BOARD_COLS;c++) if(occ.indexOf(c)===-1) free.push(c); if(!free.length)break;
    const af=roster.filter(u=>u.cost<=state.enemyGold); if(!af.length)break;
    const pk=rng()<0.7?af[af.length-1]:af[Math.floor(rng()*af.length)];
    const un=makeUnit(pk.id,'enemy'); un.row=BOARD_ROWS-1; un.col=free[Math.floor(rng()*free.length)];
    state.units.push(un); onEnter(un,state.units); state.enemyGold-=pk.cost;
    if(rng()<0.45)break;
  }
  if(rng()<0.4){ const rows=[4,5,6,7]; shiftRow(state.units,rows[Math.floor(rng()*4)],rng()<0.5?1:-1); }
}

// ================= 状态 =================
let S={}, drag=null, floats=[], hoverCell=null, selectedUid='', showRange=true, dialog=null, shopDetailId=null, xp=loadXp();
function initGame(){
  S={ phase:'select', roster:[], units:[], playerGold:0, enemyGold:START_GOLD,
      playerLife:START_LIFE, enemyLife:START_LIFE, round:0, shop:[], enemyRoster:[],
      slid:false, animating:false, log:'', level:levelOfXp(xp), xpGained:0 };
  render();
}
function toggleRoster(id){
  const u=UNIT_MAP[id];
  if(u && u.unlock > levelOfXp(xp)){ S.log='🔒 '+u.name+' 需 Lv'+u.unlock+' 解锁（当前 Lv'+levelOfXp(xp)+'）'; render(); return; }
  const i=S.roster.indexOf(id);
  if(i>=0) S.roster.splice(i,1);
  else { if(S.roster.length>=5){ S.log='最多选 5 位英雄'; render(); return; } S.roster.push(id); }
  render();
}
// 一键随机选择 5 位（只从已解锁中选）
function randomPick(){
  const lvl=levelOfXp(xp);
  S.roster=randomRoster(lvl,5,Math.random);
  S.log='🎲 随机选择了：'+S.roster.map(id=>UNIT_MAP[id].name).join('、');
  render();
}
// 退出对战：用自定义弹窗二次确认（原生 confirm 在预览 iframe 中会被浏览器拦截导致无效）
function quitGame(){
  if(S.animating){ toast('战斗演算中，请稍候'); return; }
  dialog={ title:'退出对战', text:'确定退出当前对战？中途退出将获得 0 经验，对局进度也不会保存。',
           okText:'退出', cancelText:'继续对战', onOk:function(){
             // 中途退出：本局经验清零，扣回已累积的每回合经验
             if(S.xpGained>0){ xp=Math.max(0,xp-S.xpGained); saveXp(xp); }
             dialog=null; initGame();
           } };
  render();
}
function dialogCancel(){ dialog=null; render(); }
function dialogOk(){ if(dialog&&dialog.onOk) dialog.onOk(); }
function toggleRange(){ showRange=!showRange; S.log=showRange?'已开启射程常驻显示':'已关闭射程常驻显示'; render(); }
function confirmRoster(){
  if(S.roster.length!==5) return;
  // 播放开战动画：朱砂墨晕从中心扩散 + "开战"文字，动画到一半时切换到备战界面
  const ov=document.createElement('div');
  ov.className='battle-start-overlay';
  ov.innerHTML='<div class="ink-circle"></div><div class="start-text">开 战</div>';
  document.body.appendChild(ov);
  setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },720);
  setTimeout(doConfirmRoster,360);
}
function doConfirmRoster(){
  // 敌方阵容从「已解锁」池随机，保证双方强度对等
  const lvl=levelOfXp(xp);
  S.enemyRoster=randomRoster(lvl,5,Math.random);
  S.units=[];
  S.phase='prepare'; S.round=1; S.level=levelOfXp(xp); S.playerGold=START_GOLD; S.enemyGold=START_GOLD; S.slid=false;
  S.xpGained=0;
  S.log='第 1 回合｜从商店把英雄拖到备战区（最下排）上阵';
  refreshShop(); render();
}
function refreshShop(){ S.shop=shopView(S.roster,S.level); }
function awardXp(n){ xp=Math.max(0,xp+n); saveXp(xp); S.xpGained+=n; S.level=levelOfXp(xp); }

// ===== 放置（拖拽或点击）=====
function placeAt(row,col,unitId){
  const u=UNIT_MAP[unitId];
  if(S.playerGold<u.cost){ toast('金币不足'); return false; }
  if(row!==0){ toast('只能上阵到备战区（最下第一排）'); return false; }
  // 任意阵营（含敌方）的存活单位占住该格都不能放，避免棋子重叠
  const occ=S.units.find(x=>x.alive&&x.row===row&&x.col===col);
  if(occ){ toast(occ.side==='player'?'该位置已有英雄':'该位置被敌方棋子占据'); return false; }
  const unit=makeUnit(unitId,'player'); unit.row=row; unit.col=col; unit.anim='enter';
  S.units.push(unit); onEnter(unit,S.units);
  unit.row=unit.row; // onEnter 可能改 row（大鹏突进）
  S.playerGold-=u.cost;
  S.log=u.name+' 登场！';
  setTimeout(()=>{ unit.anim=''; render(); },450);
  return true;
}
function slide(row,dir){
  if(S.phase!=='prepare'||S.slid) return;
  shiftRow(S.units,row,dir); S.slid=true;
  S.log='滑动了第 '+(row+1)+' 排（本回合滑动已用）'; render();
}
function toast(t){ S.log='⚠️ '+t; render(); }

// ===== 回合推进（带动画）=====
async function startRound(){
  if(S.phase!=='prepare'||S.animating) return;
  if(S.units.filter(u=>u.alive&&u.side==='player').length===0){ toast('先放至少一个英雄上场'); return; }
  S.animating=true; S.phase='battle'; S.log='敌方行动…'; render();
  aiTurn({units:S.units,enemyGold:S.enemyGold,enemyRoster:S.enemyRoster,round:S.round},rng);
  await sleep(400);

  // 前进动画：记录每个棋子的方向，播放 advanceMove
  S.units.forEach(u=>{ if(u.alive) u.anim='advance'; });
  S.log='全体向前推进 1 格…'; render();
  const adv=advance(S.units);
  adv.breakthroughs.forEach(b=>{ if(b.side==='player'){ S.enemyLife--; S.log='🔥 你的英雄攻入敌方大本营！敌 -1 命'; } else { S.playerLife--; S.log='💥 敌方攻入你的大本营！你 -1 命'; } });
  await sleep(420);
  S.units.forEach(u=>{ u.anim=''; });
  render();
  await sleep(200);

  // 攻击动画 + 飘字
  S.units.filter(u=>u.alive).forEach(u=>{ u.anim='attack'; });
  // 模拟攻击方向：先算事件
  const preState=S.units.map(u=>({uid:u.uid,lives:u.lives}));
  const res=combat(S.units);
  S.log='⚔️ 释放技能 & 结算';
  // 生成飘字（基于事件，位置取目标当前坐标，若已阵亡取其最后位置）
  floats=[];
  res.events.forEach(e=>{
    let target=S.units.find(u=>u.uid===e.to||u.uid===e.uid);
    if(!target) return;
    if(e.type==='dmg'){ target.anim='hurt'; floats.push({uid:target.uid,row:target.row,col:target.col,text:'-'+e.amount+'命',cls:'dmg'}); }
    else if(e.type==='heal'){ floats.push({uid:target.uid,row:target.row,col:target.col,text:'+'+e.amount+'命',cls:'heal'}); }
    else if(e.type==='revive'){ floats.push({uid:target.uid,row:target.row,col:target.col,text:'复活!',cls:'revive'}); }
  });
  render();
  await sleep(500);
  S.units.forEach(u=>{ if(u.anim==='attack'||u.anim==='hurt') u.anim=''; });
  floats=[]; render();
  await sleep(220);

  if(S.enemyLife<=0||S.playerLife<=0){
    const win=S.enemyLife<=0;
    awardXp(win?XP_WIN:XP_LOSE);
    S.phase='over'; S.animating=false; render(); return;
  }
  S.round++;
  awardXp(XP_PER_ROUND);   // 每回合累积经验
  // 经济结算：基础收入 + 利息(每5金+1，上限5) + 产金英雄 — 玩家与敌方同规则
  const inc=GOLD_PER_ROUND, gExtra=collectGold(S.units,'player');
  const interest=calcInterest(S.playerGold);
  S.playerGold+=inc+interest+gExtra;
  const eInterest=calcInterest(S.enemyGold);
  S.enemyGold+=GOLD_PER_ROUND+eInterest+collectGold(S.units,'enemy');
  S.lastInterest=interest;
  S.slid=false; S.phase='prepare'; S.animating=false;
  S.log='第 '+S.round+' 回合｜金币 +'+(inc+interest+gExtra)+
    (interest?'（利息 +'+interest+'）':'')+(gExtra?'（产金英雄 +'+gExtra+'）':'')+'｜经验 +'+XP_PER_ROUND;
  refreshShop(); render();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ================= 渲染 =================
// 双方生命用完全一致的样式渲染（对称）
function hearts(n){ let h=''; for(let i=0;i<START_LIFE;i++) h+=`<span class="hp ${i<n?'':'off'}">${i<n?'❤️':'🤍'}</span>`; return h; }
// 英雄属性可视化：命数 / 金币 / 射程 / 目标数 / 治疗
function attrRow(u){
  let h=`<div class="attr-row">`;
  h+=`<span class="attr hp"><span class="ico">❤️</span>${u.lives}</span>`;
  h+=`<span class="attr gold"><span class="ico">💰</span>${u.cost}</span>`;
  h+=`<span class="attr rng"><span class="ico">🎯</span>${u.range}</span>`;
  h+=`<span class="attr tgt"><span class="ico">⚔️</span>${u.targets}</span>`;
  if(u.heal>0) h+=`<span class="attr heal"><span class="ico">➕</span>${u.heal}</span>`;
  if(u.gold>0) h+=`<span class="attr gold"><span class="ico">🪙</span>+${u.gold}/回合</span>`;
  h+=`</div>`;
  return h;
}
// 迷你射程网格：以英雄为中心 5x5，曼哈顿距离<=range 高亮
function rangeGrid(range){
  let h='<div class="range-grid">';
  for(let r=-2;r<=2;r++){
    for(let c=-2;c<=2;c++){
      const d=Math.abs(r)+Math.abs(c);
      h+=`<div class="rg ${d===0?'self':(d<=range?'in':'')}"></div>`;
    }
  }
  return h+'</div>';
}
// 拖拽时计算某格的射程高亮范围
function inRangeOf(row,col,range,tr,tc){ return (Math.abs(tr-row)+Math.abs(tc-col))<=range; }

    const isP=r<=PLAYER_ROWS-1, isB=r===0;
    const canSlide=S.phase==='prepare'&&isP&&!S.slid;
    h+=`<div class="brow" data-row="${r}">`;
    if(canSlide) h+=`<button class="slide-btn left" onclick="slide(${r},-1)">‹</button>`;
    for(let c=0;c<BOARD_COLS;c++){
      const zone=isB?'bz':(isP?'pz':'ez');
      const u=S.units.find(x=>x.alive&&x.row===r&&x.col===c);
      const fl=floats.filter(f=>f.row===r&&f.col===c);
      // 射程高亮（三种来源，优先级从高到低）：
      //   1) 拖拽中：以 hover 格为中心 + 己方空格标绿(droppable) + 敌方半区标红(bad)
      //   2) 选中某个己方棋子：以该棋子为中心
      //   3) 常驻（showRange 开启）：所有己方棋子的射程，用淡金 dimrange 一直显示
      // dropCls 与 rangeCls 是两个独立维度，可叠加：绿底(可放) + 金边(射程内)
      let rangeCls='', dropCls='';
      const sel = selectedUid ? S.units.find(x=>x.uid===selectedUid) : null;
      if(!isP){ if(drag&&drag.heroRange!=null) rangeCls='bad'; }
      else if(drag&&drag.heroRange!=null){
        if(!cellOccupied(r,c)) dropCls='droppable';        // 己方空格 → 绿色可放
        if(hoverCell){
          const d=Math.abs(hoverCell.row-r)+Math.abs(hoverCell.col-c);
          if(d===0) rangeCls='range-src';
          else if(d<=drag.heroRange) rangeCls='inrange';
        }
      } else if(sel){
        const d=Math.abs(sel.row-r)+Math.abs(sel.col-c);
        if(d===0) rangeCls='range-src';
        else if(d<=sel.range) rangeCls='inrange';
      } else if(showRange){
        // 常驻：只要落在任意一个己方棋子的射程内就点亮
        const covered=S.units.some(u=>u.alive&&u.side==='player'&&(Math.abs(u.row-r)+Math.abs(u.col-c))<=u.range);
        if(covered) rangeCls='dimrange';
      }
      h+=`<div class="cell ${zone} ${rangeCls} ${dropCls}" data-row="${r}" data-col="${c}">`;
      if(u){
        let dots=''; for(let i=0;i<u.maxLives;i++) dots+=`<span class="lp ${i<u.lives?'':'empty'}"></span>`;
        h+=`<div class="pc ${u.side} ${u.anim?'anim-'+u.anim:''} ${selectedUid===u.uid?'sel':''}" data-uid="${u.uid}">
          <div class="pc-cost">ð°${u.cost}</div><div class="pc-emoji"><img class="sprite" src="assets/${u.id}.png" alt="${u.name}" draggable="false" onerror="this.parentNode.textContent='${u.emoji}'"></div><div class="pc-name">${u.name}</div><div class="lives-row">${dots}</div>
        </div>`;
      }
      fl.forEach(f=>{ h+=`<div class="float ${f.cls}">${f.text}</div>`; });
      h+=`</div>`;
    }
    if(canSlide) h+=`<button class="slide-btn right" onclick="slide(${r},1)">›</button>`;
    h+=`</div>`;
  }
  h+=`</div></div><div class="base-label base-player">▼ 你的大本营（最下排=备战区）</div></div>`;

  // 我方状态条（金币/利息/产金/经验）—— 分区 area-status
  const nextInt=calcInterest(S.playerGold);
  const toNext=INTEREST_PER-(S.playerGold%INTEREST_PER);
  h+=`<div class="area-status"><div class="mystatus">
    <div class="ms-item"><div class="ms-label">我的金币</div><div class="ms-val">💰${S.playerGold}</div></div>
    <div class="ms-item"><div class="ms-label">下回合利息</div><div class="ms-val small">+${nextInt}</div>
      <div class="ms-sub">${S.playerGold>=25?'已达上限':('再'+toNext+'金+1')}</div></div>
    <div class="ms-item"><div class="ms-label">产金英雄</div><div class="ms-val small">+${collectGold(S.units,'player')}</div></div>
    <div class="ms-item"><div class="ms-label">本局经验</div><div class="ms-val small">+${S.xpGained}</div></div>
  </div></div>`;

  if(S.phase==='prepare'){
    h+=`<div class="area-shop"><div class="shop-title"><span>商店（按价格排序）</span><span style="color:#8878b0">拖拽/点击上阵</span></div>`;
    h+=`<div class="shop">`;
    S.shop.forEach(s=>{
      const u=UNIT_MAP[s.id];
      const dis=S.playerGold<s.cost||s.locked;
      h+=`<div class="shop-card ${dis?'disabled':''} ${s.locked?'locked':''}"
            style="border-color:${s.color}" data-id="${s.id}">
        <div class="sc-emoji" style="background:${s.color}"><img class="sprite" src="assets/${s.id}.png" alt="" draggable="false" onerror="this.parentNode.textContent='${s.emoji}'"></div>
        <div class="sc-body">
          <div class="sc-name">${s.name}</div>
          ${attrRow(u)}
          <div class="sc-tip">${u.role}</div>
        </div>
        ${s.locked?`<div class="sc-lock">Lv${s.unlock}解锁</div>`:''}
      </div>`;
    });
    h+=`</div>`;
    // 卖出区：拖动已上阵棋子时显示，覆盖商店位置
    h+=`<div class="sell-zone"><span class="sz-ico">🗑</span><span>拖到此处卖掉</span><span style="font-size:11px;opacity:0.85">返还金币</span></div>`;
    h+=`</div>`;
    // 控制区：开战按钮 + 操作提示 + 图例/射程开关 —— 分区 area-ctrl
    h+=`<div class="area-ctrl">`;
    h+=`<button class="btn btn-go" onclick="startRound()">▶ 结束购买 · 推进战斗</button>`;
    h+=`<div class="hint">从商店拖英雄到 <b style="color:#6bff9a">备战区（最下一排）</b> 上阵 · ${S.slid?'本回合已滑动':'点 ‹ › 滑动任意一排（每回合1次）'}</div>`;
    h+=`<div class="legend">
      <span><i class="sw g"></i>可上阵</span>
      <span><i class="sw y"></i>攻击范围</span>
      <span><i class="sw r"></i>不可放</span>
      <span style="cursor:pointer;color:#3a3024" onclick="toggleRange()">${showRange?'👁 射程：开':'👁 射程：关'}</span>
    </div>`;
    h+=`</div>`;
  }
  if(S.phase==='battle') h+=`<div class="area-ctrl"><div class="hint" style="font-size:12px;color:#8a6d3b">⚔️ 推进 & 战斗演算中…</div></div>`;

  // 自定义确认弹窗（覆盖在最上层）
  if(dialog){
    h+=`<div class="mask" style="z-index:300">
      <div class="card" style="max-width:300px">
        <h2>${dialog.title}</h2>
        <div class="sub" style="margin:10px 0 16px">${dialog.text}</div>
        <div class="btn-row">
          <button class="btn btn-random" onclick="dialogCancel()">${dialog.cancelText}</button>
          <button class="btn btn-confirm" onclick="dialogOk()">${dialog.okText}</button>
        </div>
      </div></div>`;
  }
  // 商店详情面板（点击商店卡片弹出，移动端紧凑模式下用）
  if(shopDetailId){
    const u=UNIT_MAP[shopDetailId];
    const sv=S.shop.find(x=>x.id===shopDetailId);
    if(u&&sv){
      const dis=S.playerGold<u.cost||sv.locked;
      h+=`<div class="shop-detail" onclick="closeShopDetail()"><div class="shop-detail-card" onclick="event.stopPropagation()">

  if(card){ if(card.classList.contains('disabled')||card.classList.contains('locked')) return;
    d={type:'shop', id:card.dataset.id}; }
  else if(pc){ d={type:'piece', uid:pc.dataset.uid}; }
  else return;
  d.startX=e.clientX; d.startY=e.clientY; d.moved=false; d.pid=e.pointerId;
  pending=d;
}
function onDragPointerMove(e){
  if(!pending||e.pointerId!==pending.pid) return;
  if(!pending.moved){
    if(Math.hypot(e.clientX-pending.startX, e.clientY-pending.startY)<DRAG_THRESH) return;
    pending.moved=true; drag=pending; selectedUid='';
    const u = drag.type==='shop'?UNIT_MAP[drag.id]:S.units.find(x=>x.uid===drag.uid);
    drag.heroRange=u?u.range:1;
    makeGhost(); markDroppable();
    if(drag.type==='piece') toggleSell(true);
  }
  e.preventDefault();
  moveGhost(e.clientX,e.clientY);
  updateHover(e.clientX,e.clientY);
}
function onDragPointerUp(e){
  if(!pending||e.pointerId!==pending.pid) return;
  const d=pending; pending=null;
  if(!d.moved){ // 未移动 → 视为点击
    if(d.type==='shop') openShopDetail(d.id);
    else if(d.type==='piece') onTapPiece(d.uid);
    return;
  }
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const cell=el&&el.closest?el.closest('.cell'):null;
  const sell=el&&el.closest?el.closest('.sell-zone'):null;
  if(d.type==='shop'){
    if(cell) placeAt(Number(cell.dataset.row),Number(cell.dataset.col),d.id);
  } else if(d.type==='piece'){
    const u=S.units.find(x=>x.uid===d.uid);
    if(u){
      if(sell){ sellUnit(u); }
      else if(cell){
        const r=Number(cell.dataset.row), c=Number(cell.dataset.col);
        if(r>PLAYER_ROWS-1){ toast('不能移到敌方半区'); }
        else { const occ=S.units.find(x=>x.alive&&x.row===r&&x.col===c);
          if(occ&&occ.uid!==u.uid){ occ.row=u.row; occ.col=u.col; }  // 交换
          u.row=r; u.col=c; S.log=u.name+' 移动'; }
      }
    }
  }
  removeGhost(); drag=null; hoverCell=null; render();
}
// 跟随指针的幽灵图
function makeGhost(){ removeGhost();
  const g=document.createElement('div'); g.className='drag-ghost';
  g.innerHTML='<img src="'+spriteSrcOf(drag)+'" onerror="this.style.display=\'none\'">';
  document.body.appendChild(g); drag.ghost=g; }
function moveGhost(x,y){ if(drag&&drag.ghost){ drag.ghost.style.left=x+'px'; drag.ghost.style.top=y+'px'; } }
function removeGhost(){ if(drag&&drag.ghost&&drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost); if(drag) drag.ghost=null; toggleSell(false); }
// 拖动棋子时用「卖出区」覆盖商店
function toggleSell(on){ const sz=document.querySelector('.sell-zone'), sh=document.querySelector('.shop');
  if(sz){ sz.style.display=on?'flex':'none'; if(!on) sz.classList.remove('sell-hover'); }
  if(sh) sh.style.display=on?'none':''; }
// 标记可放格：商店上阵只能备战区(row0)空格；已上阵棋子可在己方 4 排空格移动
function markDroppable(){
  document.querySelectorAll('.cell').forEach(c=>{
    c.classList.remove('droppable','dragover','bad','inrange','range-src');
    const r=Number(c.dataset.row), cc=Number(c.dataset.col), isP=r<=PLAYER_ROWS-1;
    if(drag.type==='shop'){ if(r===0&&!cellOccupied(r,cc)) c.classList.add('droppable'); else if(r!==0) c.classList.add('bad'); }
    else if(drag.type==='piece'){ if(isP&&!cellOccupied(r,cc)) c.classList.add('droppable'); else if(!isP) c.classList.add('bad'); }
  });
}
// 当前指向格/卖出区的高亮反馈
function updateHover(x,y){
  document.querySelectorAll('.cell.dragover').forEach(c=>c.classList.remove('dragover'));
  const szAll=document.querySelector('.sell-zone'); if(szAll) szAll.classList.remove('sell-hover');
  const el=document.elementFromPoint(x,y); if(!el||!el.closest) return;
  const cell=el.closest('.cell'), sell=el.closest('.sell-zone');
  if(cell&&cell.classList.contains('droppable')) cell.classList.add('dragover');
  else if(sell&&drag.type==='piece') sell.classList.add('sell-hover');
}
// 卖出棋子：移除并返还金币（成本全额）
function sellUnit(u){
  const cost=(UNIT_MAP[u.id]||{}).cost||0;
  const i=S.units.indexOf(u); if(i>=0) S.units.splice(i,1);
  S.playerGold+=cost; S.log='💰 卖出 '+u.name+'，返还 '+cost+' 金币';
}
// 一次性委托绑定（document 级，render 重建 DOM 也不受影响）
document.addEventListener('pointerdown', onDragPointerDown);
document.addEventListener('pointermove', onDragPointerMove, {passive:false});
document.addEventListener('pointerup', onDragPointerUp);
document.addEventListener('pointercancel', function(){ if(pending){ pending=null; removeGhost(); drag=null; hoverCell=null; render(); } });

initGame();
</script>
</body>
